---
layout: default
---
<p class="back"><a href="{{ '/' | relative_url }}">← Abhay Bestrapalli</a></p>
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.reading %} · {{ page.reading }}{% endif %}</p>
  </header>
  {{ content }}
</article>
